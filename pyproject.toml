[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-mcp"
version = "0.1.0"
description = "MCP server that controls a Line 6 Helix (LT/Floor/Rack) over USB MIDI and generates .hlx presets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gerardo de la Riva" }]
dependencies = [
  "mcp[cli]>=1.2",
  "mido>=1.3",
  "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
helix-mcp = "helix_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helix_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
